<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Battleship</h1>
    <button type="button" id="new-game">New Game</button>
  </header>

  <p id="message" class="message"></p>

  <section class="summary" id="summary" hidden>
    <h2 id="summary-title"></h2>
    <dl class="summary-stats">
      <div><dt>Shots fired</dt><dd id="stat-shots"></dd></div>
      <div><dt>Hits</dt><dd id="stat-hits"></dd></div>
      <div><dt>Accuracy</dt><dd id="stat-accuracy"></dd></div>
    </dl>
    <p class="survivors"><span id="survivors-label"></span> <span id="survivors"></span></p>
    <button type="button" id="play-again">Play Again</button>
  </section>

  <main class="boards">
    <section class="board-panel" id="player-panel">
      <h2 id="player-title">Your fleet</h2>
      <div class="board" id="player-board"></div>
      <ul class="fleet" id="player-fleet"></ul>
    </section>

    <section class="board-panel" id="enemy-panel">
      <h2 id="enemy-title">Enemy waters</h2>
      <div class="board" id="enemy-board"></div>
      <ul class="fleet" id="enemy-fleet"></ul>
    </section>
  </main>

  <ul class="legend">
    <li><span class="cell ship"></span> Your ship</li>
    <li><span class="cell hit">✕</span> Hit</li>
    <li><span class="cell miss">•</span> Miss</li>
    <li><span class="cell hit sunk">✕</span> Sunk ship</li>
  </ul>
  <p class="hint" id="keyboard-help">No mouse? Press Tab to reach the enemy board, use the arrow keys to move, and press Enter or Space to fire.</p>

  <noscript>This game needs JavaScript turned on.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
